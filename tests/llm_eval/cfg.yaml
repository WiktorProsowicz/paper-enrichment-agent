---
mlflow_tracking_uri: http://mlflow:5000
test_case_exec_timeout: 1800
active_suites: [test_footnote_enrichment, test_paper_access]

judge_llm_config:
  model_name: ''
  api_key: ''
  model_params:
    temperature: 0.3
    request_timeout: 600

suite_configs:
  llm-eval/test-footnote-enrichment:
    footnote_enrichment_service_url: http://footnote-enrichment-agent:8081

    datasets:
      footnote_enrichment: footnote_enrichment_ds/v1

    thresholds:
      footnote_enrichment:
        figure_usefulness_rating/mean: 4.0
        text_relevance_rating/mean: 7.0
        title_relevance_rating/mean: 2.5
        success_rate:extract_paragraph_citation/mean: 0.8

  llm-eval/test-paper-access:
    paper_scraping_service_url: http://paper-scraping-service:8083

    datasets:
      paper_access: paper_access_ds/v1

    thresholds:
      paper_access:
        access_type_correct/mean: 1.0
        access_source_correct/mean: 1.0
