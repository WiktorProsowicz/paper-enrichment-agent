    footnote_enrichment_service_url: "http://footnote-enrichment-agent:8081"
    enrichment_service_request_timeout: 1800

    datasets:
      footnote_enrichment: "footnote_enrichment_ds/v1"
    
    thresholds:
      footnote_enrichment:
        figure_usefulness_rating: 4.0
        tool_call_success_rate: 0.8
        call_tool_count: 0.0
        agent_reasoning_count: 0.0
        agent_action_count: 0.0
        revealed_paragraphs: 0.0
        revealed_figures: 0.0
    
    judge_llm_config:
      model_name: deepinfra/meta-llama/Llama-3.3-70B-Instruct-Turbo
      api_key: JUDGE_LLM_API_KEY
      model_params:
        temperature: 0.3