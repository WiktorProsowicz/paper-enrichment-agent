---
name: llm-eval

services:
  footnote-enrichment-agent:
    image: app-base:runtime
    container_name: llm-eval-footnote-enrichment-agent
    restart: unless-stopped
    command: [uv, run, python, -m, paper_enrichment_agent.footnote_enrichment_agent.main, 'agent_llm_model=${LLM_MODEL}', 'llm_api_key=${LLM_API_KEY}']
    healthcheck:
      test: [CMD-SHELL, curl -f http://localhost:8081/health || exit 1]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - paper-enrichment-agent-network

  eval-runner:
    image: app-base:eval
    restart: no
    container_name: llm-eval-eval-runner
    command: [uv, run, python, tests/llm_eval/run_eval.py, 'judge_llm_config.model_name=${JUDGE_LLM_MODEL}', 'judge_llm_config.api_key=${JUDGE_LLM_API_KEY}']
    depends_on:
      footnote-enrichment-agent:
        condition: service_healthy
    networks:
      - paper-enrichment-agent-network


networks:
  paper-enrichment-agent-network:
    external: true
    name: paper-enrichment-agent-network
