---
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # The services mount the Prometheus ASGI app under `/metrics`, which redirects to `/metrics/`.
  - job_name: main_survey_enricher
    metrics_path: /metrics/
    static_configs:
      - targets: [main-survey-enricher:8082]

  - job_name: footnote_enrichment_agent
    metrics_path: /metrics/
    static_configs:
      - targets: [footnote-enrichment-agent:8081]
