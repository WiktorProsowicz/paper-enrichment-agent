[project]
name = "paper_enrichment_agent"
version = "0.1.0"
requires-python=">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.67",
    "boto3-stubs[s3]>=1.43.68",
    "fastapi>=0.140.7",
    "fastmcp>=3.4.7",
    "hydra-core>=1.3.5",
    "langchain>=1.3.16",
    "langchain-litellm>=0.7.0",
    "langgraph>=1.2.11",
    "litellm>=1.98.0",
    "mcp>=1.29.0",
    "mlflow>=3.15.1",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "structlog>=26.1.0",
    "uvicorn>=0.52.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mock>=5.2.0",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-dependency>=0.6.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.0",
    "structlog>=26.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplifications
]
ignore = ["W191"]
exclude = ["tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["I"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.coverage.report]
fail_under = 90
show_missing = true
omit = [
    "src/paper_enrichment_agent/footnote_enrichment_agent/components/agent.py",
    "src/paper_enrichment_agent/footnote_enrichment_agent/main.py",
]

[tool.mypy]
disable_error_code = "import-untyped"
strict = true
exclude = ["tests"]
