[project]
name = "paper_enrichment_agent"
version = "0.1.0"
requires-python=">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.140.7",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplifications
]
ignore = ["W191"]
exclude = ["tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
disable_error_code = "import-untyped"
strict = true
exclude = ["tests"]
